on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the distributions of ROS 2 which are released, and rolling for the APIs of the next ones
        ROS_DISTRO: [jazzy, kilted, lyrical, rolling]
    name: build_and_test (${{ matrix.ROS_DISTRO }})
    steps:
      - uses: actions/checkout@v4
      # Only the packages below are ported to ROS 2; the others are of ROS 1 only. They are skipped
      # here by an AMENT_IGNORE (rosdep) and a COLCON_IGNORE (colcon of rolling no longer honors
      # AMENT_IGNORE) of this workspace only, not in the repository, where rosdep of ROS 1 would skip
      # them as well. Add a package here once it builds on ROS 2.
      - name: Skip the packages of ROS 1 only
        env:
          ROS2_PACKAGES: jsk_recognition_msgs jsk_recognition_utils
        run: |
          # every directory, not only the ones with a package.xml: newer colcon (lyrical, rolling) also
          # builds plain CMake projects such as cr_calibration
          for dir in */; do
            pkg=${dir%/}
            case " $ROS2_PACKAGES " in
              *" $pkg "*) echo "build $pkg" ;;
              *) touch "$pkg/AMENT_IGNORE" "$pkg/COLCON_IGNORE" ;;
            esac
          done
      # ccache of the compiler and the .deb files rosdep downloads, per distribution
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ccache
            ${{ runner.temp }}/apt-archives
          key: ros2-${{ matrix.ROS_DISTRO }}-${{ github.sha }}
          restore-keys: ros2-${{ matrix.ROS_DISTRO }}-
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
          CCACHE_DIR: ${{ runner.temp }}/ccache
          # keep the downloaded .deb files (the docker images of ROS delete them by docker-clean)
          DOCKER_RUN_OPTS: -v ${{ runner.temp }}/apt-archives:/var/cache/apt/archives
          BEFORE_INIT: rm -f /etc/apt/apt.conf.d/docker-clean
          # rosdep's `pip:` installer refuses to install globally on
          # Python >= 3.11 (PEP 668) unless explicitly told to.
          PIP_BREAK_SYSTEM_PACKAGES: '1'
